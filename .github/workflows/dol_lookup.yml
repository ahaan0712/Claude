name: Refresh data and deploy site

on:
  workflow_dispatch:

  schedule:
    - cron: "0 13 1 * *"

  push:
    branches:
      - "claude/campaign-27-v7-matcher-ofaf2m"
    paths:
      - "index.html"
      - "*.py"
      - "profile_verified_from_resume.json"
      - "preferences_summer_2027.json"
      - ".github/workflows/dol_lookup.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh DOL and H-1B sponsorship evidence
        run: python3 dol_lookup.py

      - name: Generate personalized internship recommendations
        run: python3 score.py

      - name: Commit updated recommendation data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/dol_lookup.json \
            data/matches.json

          if git diff --cached --quiet; then
            echo "No generated data changes."
          else
            git commit -m "Refresh sponsorship evidence and recommendations"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
