name: Deploy app.html to GitHub Pages

on:
  push:
    branches: ["claude/campaign-27-v7-matcher-ailg6c"]
    paths:
      - "app.html"
      - "data/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build static site (app.html served at the root as index.html)
        run: |
          mkdir -p _site
          cp app.html _site/index.html
          cp -r data _site/data

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
