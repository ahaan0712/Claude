name: CI
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile production modules
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m pytest -q
      - name: Run pipeline
        run: python run_pipeline.py
      - name: Validate generated schemas
        run: python - <<'PY'
          import json
          from schema import validate_posting
          for f in ['data/live_matches.json','data/review_queue.json','data/excluded_postings.json']:
              for p in json.load(open(f)):
                  validate_posting(p)
          PY
      - name: Build site and privacy checks
        run: python build_site.py
